apiVersion: v1
kind: ConfigMap
metadata:
  name: kfp-launcher
  namespace: kubeflow  
data:
  defaultPipelineRoot: s3://{{ .Values.bucket }}
  providers: |-
    s3:
      default:
        endpoint: {{ .Values.objStoreHost }}
        disableSSL: "{{ .Values.disableSSL }}"
        region: {{ .Values.objStoreRegion }}
        credentials:
          fromEnv: false
          secretRef:
            secretName: mlpipeline-minio-artifact
            accessKeyKey: accesskey
            secretKeyKey: secretkey  